<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact – SmartChat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="page-wrapper">
    <header class="navbar">
      <div class="nav-left">
        <div class="logo-circle">S</div>
        <div>
          <div class="brand-name">SmartChat</div>
          <div class="brand-tagline">Unbiased AI Assistant</div>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="chat.html">Chat</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </header>

    <main class="main-content">
      <section class="basic-card">
        <h1>Contact</h1>
        <p>
          Have feedback, ideas or want to extend SmartChat? Reach out using the form below
          or connect directly via email.
        </p>

        <form class="contact-form" onsubmit="event.preventDefault(); alert('This is a static demo form. You can connect it to email or backend later.');">
          <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Your name" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" required />
          </div>
          <div>
            <label for="msg">Message</label>
            <textarea id="msg" placeholder="Share your thoughts…"></textarea>
          </div>
          <div style="margin-top:4px;">
            <button class="btn-primary" type="submit">Send message</button>
          </div>
        </form>

        <p style="margin-top:12px; font-size:0.82rem; color:var(--text-muted);">
          You can also link this page to your real email or API later.
        </p>
      </section>
    </main>

    <footer class="footer">
      <span>SmartChat · Say hi anytime.</span>
      <span>Made with ❤️ and glass.</span>
    </footer>
  </div>
</body>
</html>
